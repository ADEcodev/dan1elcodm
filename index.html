<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences (dark/light)
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change to your Brand / TikTok Name -->
    <title>My Links | TikTok Bio</title>
    <link rel="icon" type="image/png" href="images/avatar.png">

    <!-- Meta Description - Shown in search previews & chat link cards -->
    <meta name="description" content="Connect with me across all my social media platforms and join our WhatsApp community!">

    <!-- Canonical URL -->
    <link rel="canonical" href="#">

    <!-- Author Information -->
    <meta name="author" content="Your Name">

    <!-- Browser UI Color -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Font Preloads -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              Avatar styling options:
              - avatar--rounded: Circular avatar
              - avatar--soft: Rounded corners
              - avatar--none: Sharp corners
              Replace images/avatar.png with your own profile image!
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Profile Picture" width="128" height="128" fetchpriority="high">

            <!-- Name or Brand -->
            <h1>Your Name / Brand</h1>

            <!-- Bio / Tagline for TikTok audience -->
            <p>Welcome! Tap below to join our community and connect with me across platforms 👇</p>

            <!-- All your active buttons -->
            <nav class="button-stack" aria-label="Links">

              <!-- WhatsApp Community / Group -->
              <a class="button button-whatsapp" href="https://chat.whatsapp.com/YOUR_GROUP_CODE_HERE" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/whatsapp.svg" alt="WhatsApp Logo">Join Our WhatsApp Group
              </a>

              <!-- TikTok -->
              <a class="button button-tiktok" href="https://www.tiktok.com/@yourusername" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">Follow on TikTok
              </a>

              <!-- YouTube -->
              <a class="button button-youtube" href="https://www.youtube.com/@yourchannel" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">Subscribe on YouTube
              </a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/yourusername" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Follow on Instagram
              </a>

              <!-- Telegram (Optional - uncomment to enable) -->
              <!--
              <a class="button button-telegram" href="https://t.me/yourusername_or_channel" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/telegram.svg" alt="Telegram Logo">Join Telegram Channel
              </a>
              -->

              <!-- Discord Server (Optional - uncomment to enable) -->
              <!--
              <a class="button button-discord" href="https://discord.gg/yourinvitecode" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/discord.svg" alt="Discord Logo">Join Discord Community
              </a>
              -->

              <!-- X / Twitter (Optional - uncomment to enable) -->
              <!--
              <a class="button button-x" href="https://x.com/yourusername" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/x.svg" alt="X Logo">Follow on X
              </a>
              -->

              <!-- Generic Website / Store (Optional - uncomment to enable) -->
              <!--
              <a class="button button-default" href="https://yourwebsite.com" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Visit My Website
              </a>
              -->

            </nav>
          </main>

          <footer>
            <span>Connect with me</span> • <span>All Rights Reserved</span>
          </footer>

        </div>
    </div>

</body>
</html>
